{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Espace membre{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0D2B55',
            gold: '#C9A02C',
            cream: '#FAFAF7',
            success: '#0B6B39',
            danger: '#C0392B',
            orange: '#E67E22',
          },
          fontFamily: {
            display: ['Georgia', 'serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
      <style>
      .header-member  {
          background: #111111 !important;
      }
    </style>

  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/home.css' %}" />
</head>
<body class="bg-cream text-navy font-body antialiased">
  <div class="min-h-screen flex">
    {# Sidebar supprimée pour laisser le contenu full width #}
    <div class="flex-1 min-h-screen">
      {% include 'partials/header_member.html' %}
      {% include 'partials/messages.html' %}

<main class="pt-20 sm:pt-24 w-full pb-12 px-4 sm:px-6">
        {% block content %}{% endblock %}
      </main>
      
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuToggle = document.getElementById('member-menu-toggle');
      const mobileMenu = document.getElementById('member-mobile-menu');
      
      if (menuToggle && mobileMenu) {
        menuToggle.addEventListener('click', function() {
          mobileMenu.classList.toggle('hidden');
          menuToggle.textContent = mobileMenu.classList.contains('hidden') ? '☰' : '✕';
        });

        document.querySelectorAll('#member-mobile-menu .mobile-nav-link').forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
            menuToggle.textContent = '☰';
          });
        });
      }
    });
  </script>


</body>
</html>
