{% extends 'layouts/base_admin.html' %}

{% block title %}Modifier méthode de paiement | EliteBuro{% endblock %}

{% block content %}
  <div class="flex items-end justify-between gap-6">
    <div>
      <h1 class="text-3xl font-bold text-navy">Modifier méthode de paiement</h1>
      <p class="mt-2 text-sm text-gray-600">{{ method.nom }}</p>
    </div>
  </div>

  <form method="post" class="mt-6 rounded-2xl border border-navy/10 bg-white shadow-sm p-6" action="">
    {% csrf_token %}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-bold text-navy">Nom</label>
        <input name="nom" class="mt-2 w-full rounded-md border border-navy/20 p-2" value="{{ method.nom }}" required />
      </div>
      <div>
        <label class="text-sm font-bold text-navy">Code</label>
        <input name="code" class="mt-2 w-full rounded-md border border-navy/20 p-2" value="{{ method.code }}" required />
      </div>
      <div>
        <label class="text-sm font-bold text-navy">Ordre</label>
        <input name="ordre" type="number" class="mt-2 w-full rounded-md border border-navy/20 p-2" value="{{ method.ordre }}" />
      </div>
    </div>

    <div class="mt-6 flex gap-3">
      <button type="submit" class="rounded-md bg-success px-4 py-2 font-bold text-white">Enregistrer</button>
      <a class="rounded-md border border-navy/20 px-4 py-2 font-bold text-navy" href="{% url 'dashboard_admin:payment_methods' %}">← Retour</a>
    </div>
  </form>
{% endblock %}
