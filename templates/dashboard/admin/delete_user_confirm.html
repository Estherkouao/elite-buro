{% extends 'layouts/base_admin.html' %}

{% block title %}Supprimer utilisateur | EliteBuro{% endblock %}

{% block content %}
  <div>
    <h1 class="text-3xl font-bold text-navy">Supprimer utilisateur</h1>
    <p class="mt-2 text-sm text-gray-600">Action irréversible</p>
  </div>

  <div class="mt-6 rounded-3xl border border-red-500/20 bg-white p-6 shadow-sm">
    <p class="text-sm text-gray-700">
      Confirmer la suppression de :
      <span class="font-semibold">{{ target_user.full_name|default:target_user.email }}</span>
    </p>

    <form method="post" class="mt-6 flex items-center gap-3">
      {% csrf_token %}
      <a href="{% url 'dashboard_admin:users' %}" class="inline-flex items-center justify-center rounded-2xl border border-navy/10 bg-gray-50 px-4 py-3 text-sm font-semibold text-navy hover:border-gold/40">Annuler</a>
      <button type="submit" class="inline-flex items-center justify-center rounded-2xl bg-red-600 px-4 py-3 text-sm font-semibold text-white hover:bg-red-700">Supprimer</button>
    </form>
  </div>
{% endblock %}
