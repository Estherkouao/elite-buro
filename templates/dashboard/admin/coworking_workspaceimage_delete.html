{% extends 'layouts/base_admin.html' %}

{% block title %}Supprimer photo | EliteBuro{% endblock %}

{% block content %}
  <div>
    <h1 class="text-3xl font-bold text-navy">Supprimer la photo</h1>
  </div>

  <div class="mt-6 rounded-3xl border border-red-500/20 bg-white shadow-sm p-6">
    <p class="font-semibold text-navy">Photo de : {{ target_image.workspace.nom }}</p>
    <p class="text-sm mt-2 text-gray-600">Le fichier sera supprimé de la base.</p>

    <form method="post" class="mt-6">
      {% csrf_token %}
      <div class="flex gap-3">
        <button type="submit" class="rounded-md bg-red-600 px-4 py-2 text-white font-semibold">Supprimer</button>
        <a href="{% url 'dashboard_admin:coworking' %}" class="rounded-md border border-navy/20 px-4 py-2 text-navy font-semibold">Annuler</a>
      </div>
    </form>
  </div>
{% endblock %}
