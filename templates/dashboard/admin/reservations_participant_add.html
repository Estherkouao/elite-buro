{% extends 'layouts/base_admin.html' %}

{% block title %}Ajouter participant | EliteBuro{% endblock %}

{% block content %}
  <div>
    <h1 class="text-3xl font-bold text-navy">Ajouter participant</h1>
    <p class="mt-2 text-sm text-gray-600">Pour la réservation #{{ reservation.reservation_number }}</p>
  </div>

  <div class="mt-6 rounded-3xl border border-navy/10 bg-white shadow-sm p-6">
    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="rounded-md bg-navy px-4 py-2 font-bold text-white">Enregistrer</button>
      <a href="{% url 'dashboard_admin:reservation_detail' reservation.id %}" class="ml-4 text-navy font-bold">Annuler</a>
    </form>
  </div>
{% endblock %}
