{% load static %}
<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EliteBuro{% endblock %}</title>

    <!-- Google Fonts (EliteBuro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Styles landing + site -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">

    {% block extra_css %}
    <style>
        /* Elite Banner - Localisation */
        .elite-banner {
            background: #FF8000;
            padding: 8px 0;
            font-size: 12px;
            color: #000;
        }
        .elite-banner-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .elite-banner-tagline {
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .elite-banner-location {
            font-weight: 400;
            opacity: 0.9;
        }
        @media (min-width: 640px) {
            .elite-banner {
                padding: 6px 0;
                font-size: 13px;
            }
            .elite-banner-content {
                flex-direction: row;
                justify-content: space-between;
            }
        }
    </style>
{% endblock %}
</head>
<body class="bg-cream text-navy font-body antialiased">

    {% include 'partials/navbar.html' %}
    {% include 'partials/messages.html' %}

    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    {% block extra_js %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menu-toggle');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (menuToggle && mobileMenu) {
                menuToggle.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                    menuToggle.textContent = mobileMenu.classList.contains('hidden') ? '☰' : '✕';
                });

                document.querySelectorAll('#mobile-menu a').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                        menuToggle.textContent = '☰';
                    });
                });
            }

            const dropdownToggles = document.querySelectorAll('.mobile-dropdown-toggle');
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const dropdown = this.nextElementSibling;
                    dropdown.classList.toggle('hidden');
                    this.querySelector('span').textContent = dropdown.classList.contains('hidden') ? '▼' : '▲';
                });
            });
        });
    </script>
    {% endblock %}
</body>
</html>
