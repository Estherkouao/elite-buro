<!DOCTYPE html>
<html lang="fr">

<head>

    {% load static %}

    <meta charset="UTF-8">

    <title>
        {% block title %}EliteBuro{% endblock %}
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- CSS EliteBuro -->
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/coworking.css' %}">


{% load static %}
    <!-- Google Fonts (EliteBuro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>



    <!-- Configuration identité graphique EliteBuro -->
    <script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {

                        /* Couleurs principales */
                        navy: '#000000',      // Noir
                        gold: '#FF8000',      // Orange
                        cream: '#F5F5F5',     // Gris très clair

                        /* Gris */
                        gray: {
                            50: '#F9FAFB',
                            100: '#F3F4F6',
                            200: '#E5E7EB',
                            300: '#D1D5DB',
                            400: '#9CA3AF',
                            500: '#6B7280',
                            600: '#4B5563',
                            700: '#374151',
                            800: '#1F2937',
                            900: '#111827',
                        },

                        /* Couleurs d'état */
                        success: '#16A34A',
                        danger: '#DC2626',
                        warning: '#F59E0B',
                    },

                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace'],
                    }
                }
            }
        }

    </script>



    {% block extra_css %}
    {% endblock %}


</head>




<body class="bg-cream text-navy font-body">
    


    <!-- Navigation -->
    {% include 'partials/navbar.html' %}



    <!-- Messages Django -->
    {% include 'partials/messages.html' %}




    <!-- Contenu des pages -->
    <main class="min-h-screen pt-24">

        {% block content %}

        {% endblock %}

    </main>




    <!-- Footer -->
    {% include 'partials/footer.html' %}




    {% block extra_js %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menu-toggle');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (menuToggle && mobileMenu) {
                menuToggle.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                    menuToggle.textContent = mobileMenu.classList.contains('hidden') ? '☰' : '✕';
                });

                document.querySelectorAll('#mobile-menu a').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                        menuToggle.textContent = '☰';
                    });
                });
            }

            const dropdownToggles = document.querySelectorAll('.mobile-dropdown-toggle');
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const dropdown = this.nextElementSibling;
                    dropdown.classList.toggle('hidden');
                    this.querySelector('span').textContent = dropdown.classList.contains('hidden') ? '▼' : '▲';
                });
            });
        });
    </script>
    {% endblock %}



</body>

</html>
