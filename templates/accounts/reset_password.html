<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Reset Password</h2>

        <form method="POST">
            {% csrf_token %}
            <input class="auth-input" type="password" name="new_password1" placeholder="Nouveau mot de passe">
            <input class="auth-input" type="password" name="new_password2" placeholder="Confirmer">

            <button class="auth-btn">Changer</button>
        </form>
    </div>
</div>
