<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Mot de passe oublié</h2>

        <form method="POST">
            {% csrf_token %}
            <input class="auth-input" type="email" name="email" placeholder="Email">

            <button class="auth-btn">Envoyer lien</button>
        </form>
    </div>
</div>
