<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié | EliteBuro</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #FAFAF7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }


        .container {
            width: 100%;
            max-width: 450px;
        }


        .back-home {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            color: #C9A02C;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }


        .back-home:hover {
            text-decoration: underline;
        }



        .card {

            background: #ffffff;
            border-radius: 28px;
            padding: 45px 35px;
            box-shadow: 0 20px 50px rgba(13,43,85,0.12);
            animation: fadeIn 0.5s ease;

        }



        h1 {

            text-align: center;
            color: #0D2B55;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;

        }



        .description {

            text-align: center;
            color: #64748B;
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 35px;

        }



        .form-group {

            margin-bottom: 25px;

        }



        label {

            display: block;
            color: #0D2B55;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;

        }



        input {

            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #D1D5DB;
            outline: none;
            font-size: 15px;
            transition: 0.3s;

        }




        input:focus {

            border-color: #C9A02C;
            box-shadow: 0 0 0 3px rgba(201,160,44,0.15);

        }





        .error {

            color: #EF4444;
            font-size: 13px;
            margin-top: 8px;

        }





        button {

            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #0D2B55;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;

        }



        button:hover {

            background: #C9A02C;
            color: #0D2B55;
            transform: translateY(-2px);

        }




        .login-link {

            text-align: center;
            margin-top: 25px;
            font-size: 14px;

        }



        .login-link a {

            color: #0D2B55;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;

        }



        .login-link a:hover {

            color: #C9A02C;

        }





        .brand {

            text-align: center;
            margin-top: 30px;
            color: #94A3B8;
            font-size: 13px;

        }




        .brand strong {

            color: #C9A02C;

        }





        @keyframes fadeIn {

            from {

                opacity:0;
                transform: translateY(20px);

            }


            to {

                opacity:1;
                transform: translateY(0);

            }

        }





        @media(max-width:480px){

            .card {

                padding: 35px 25px;

            }


            h1 {

                font-size: 26px;

            }

        }



    </style>

</head>



<body>


<div class="container">



    <a href="{% url 'core:home' %}" class="back-home">
        ← Retour à l'accueil
    </a>



    <div class="card">


        <h1>
            🔐 Mot de passe oublié
        </h1>



        <p class="description">
            Saisissez votre adresse email.
            Nous vous enverrons un lien pour réinitialiser votre mot de passe.
        </p>




        <form method="POST">

            {% csrf_token %}



            <div class="form-group">


                <label for="id_email">
                    Adresse Email
                </label>



                <input 
                    type="email"
                    name="email"
                    id="id_email"
                    placeholder="votre@email.com"
                    required
                >



                {% if form.email.errors %}

                    <p class="error">
                        {{ form.email.errors.0 }}
                    </p>

                {% endif %}



            </div>




            <button type="submit">
                ✉️ Envoyer le lien
            </button>



        </form>




        <p class="login-link">

            <a href="{% url 'accounts:login' %}">
                ← Retour à la connexion
            </a>

        </p>




        <div class="brand">
            © EliteBuro — <strong>Solutions professionnelles</strong>
        </div>



    </div>



</div>



</body>

</html>
