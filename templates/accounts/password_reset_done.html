<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email envoyé | EliteBuro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #FAFAF7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(13, 43, 85, 0.12);
            animation: fadeIn 0.5s ease-in-out;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 25px;
        }

        h1 {
            color: #FF8000;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .message {
            color: #64748B;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .info {
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #FF8000;
            color: #ffffff;
            padding: 14px 35px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #FF8000;
            color: #111111;
            transform: translateY(-3px);
        }

        .brand {
            margin-top: 35px;
            font-size: 14px;
            color: #94A3B8;
        }

        .brand strong {
            color: #C9A02C;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @media(max-width:480px){

            .card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .icon {
                font-size: 55px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="icon">
                📧
            </div>


            <h1>
                Email envoyé
            </h1>


            <p class="message">
                Si un compte existe avec cette adresse email,
                vous recevrez un lien pour réinitialiser votre mot de passe.
            </p>


            <p class="info">
                Vérifiez votre boîte de réception ainsi que vos courriers indésirables (spams).
            </p>


            <a href="{% url 'accounts:login' %}" class="btn">
                ← Retour à la connexion
            </a>


            <div class="brand">
                © EliteBuro — <strong>Solutions professionnelles</strong>
            </div>

        </div>

    </div>


</body>
</html>
