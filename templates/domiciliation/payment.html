<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EliteBuro - Paiement</title>
    <link rel="stylesheet" href="../../static/css/domiciliation.css">
</head>
<body>
    <div class="container">
        <nav class="breadcrumb">
            <a href="index.html">Accueil</a> / Paiement
        </nav>

        <div style="max-width: 600px; margin: 0 auto;">
            <div class="card" style="text-align: center;">
                <h1 style="color: var(--primary); margin-bottom: 20px;">Règlement de votre dossier</h1>
                <p style="color: var(--gray); margin-bottom: 30px;">Dossier : <strong>#DOM-2026-001</strong></p>
                
                <div style="background: var(--light); padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: left;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Formule Professionnelle</span>
                        <span>35 000 F</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Dépôt de garantie (caution)</span>
                        <span>35 000 F</span>
                    </div>
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; color: var(--primary);">
                        <span>Total à payer</span>
                        <span>70 000 F CFA</span>
                    </div>
                </div>

                <h4 style="margin-bottom: 20px;">Choisissez votre mode de paiement</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
                    <button class="btn btn-outline" style="padding: 20px;">Orange Money</button>
                    <button class="btn btn-outline" style="padding: 20px;">Wave</button>
                    <button class="btn btn-outline" style="padding: 20px;">Moov Money</button>
                    <button class="btn btn-outline" style="padding: 20px;">Carte Bancaire</button>
                </div>

                <a href="history.html" class="btn btn-primary" style="width: 100%;">Confirmer le paiement (CinetPay)</a>
            </div>
        </div>
    </div>
</body>
</html>
