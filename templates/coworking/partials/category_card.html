{% load static %}

<div
  data-category-card
  class="group rounded-2xl border border-navy/10 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:shadow-xl focus-within:ring-2 focus-within:ring-gold"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <h3 class="font-display text-lg font-bold text-navy">{{ category.nom }}</h3>
      <p class="mt-2 text-sm text-navy/70">Explorez les espaces {{ category.nom|lower }} disponibles.</p>
    </div>

    <div class="rounded-2xl bg-navy/5 p-3">
      <svg class="h-6 w-6 text-gold" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2a7 7 0 00-7 7v3.5a2.5 2.5 0 002.5 2.5H6a3 3 0 003 3h6a3 3 0 003-3h-.5A2.5 2.5 0 0019 12.5V9a7 7 0 00-7-7zm-3 9V9a3 3 0 016 0v2H9z" />
      </svg>
    </div>
  </div>

  <div class="mt-5 flex items-center justify-between">
    <span class="text-xs font-semibold text-navy/60">Type</span>
    <span class="inline-flex items-center rounded-full border border-navy/10 bg-navy/5 px-3 py-1 text-xs font-semibold text-navy/80">
      {{ category.slug }}
    </span>
  </div>

  <a
    href="{% url 'coworking:workspace_list' %}?categorie={{ category.slug }}"
    class="mt-6 inline-flex w-full items-center justify-center rounded-2xl bg-gold px-5 py-3 text-sm font-bold text-navy shadow-sm transition hover:opacity-95 focus:outline-none focus:ring-2 focus:ring-gold focus:ring-offset-2"
  >
    Explorer
    <svg class="ml-2 h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
    </svg>
  </a>
</div>
